# ═══════════════════════════════════════════════════════════════════════════
# pytest configuration for pacman-bteng
#
#   ./.venv/bin/python -m pytest -q
#
# The suite is deliberately cheap: no pygame window, no ZMQ socket, no sleeping
# and no network, so it runs in a couple of seconds and can sit in a pre-commit
# hook.  tests/ is NOT a package on purpose — that is what lets the test modules
# import the shared helpers straight out of conftest.py.
# ═══════════════════════════════════════════════════════════════════════════
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers
filterwarnings =
    error::DeprecationWarning:pacman_bteng.*
